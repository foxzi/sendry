<title>Sendry: карта серверов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control bar (scenario, buttons, current step) + map that fits the viewport + reference cards below. */
:root {
  --bg: #f2f4f7;
  --fg: #17212b;
  --muted: #5b6977;
  --line: #c6cfd9;
  --surface: #ffffff;
  --surface-2: #e9edf2;
  --panel: #0f7b6c;
  --mta: #2457c5;
  --ext: #8a6d3b;
  --ci: #5b5f66;
  --mail: #e08a1c;
  --api: #2457c5;
  --disk: #7a3fb8;
  --pkg: #2e8b57;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --fg: #e4e9ef; --muted: #98a5b3; --line: #2b3844; --surface: #171f28; --surface-2: #1f2932;
    --panel: #2fb8a3; --mta: #6b93f0; --ext: #c9a66b; --ci: #a0a6ad;
    --mail: #f0a53c; --api: #6b93f0; --disk: #b07ae6; --pkg: #4fc47f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --fg: #e4e9ef; --muted: #98a5b3; --line: #2b3844; --surface: #171f28; --surface-2: #1f2932;
  --panel: #2fb8a3; --mta: #6b93f0; --ext: #c9a66b; --ci: #a0a6ad;
  --mail: #f0a53c; --api: #6b93f0; --disk: #b07ae6; --pkg: #4fc47f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }

h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(22px, 2.6vw, 30px);
  line-height: 1.1;
  margin: 18px 0 0;
  text-wrap: balance;
}

/* Sticky control bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  display: grid;
  gap: 8px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tab {
  font: 500 13px var(--font-body);
  color: var(--fg);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btns { display: flex; gap: 6px; margin-left: auto; }
.btn {
  font: 600 13px var(--font-body);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
.btn.primary { background: var(--mta); color: #fff; border-color: var(--mta); }
.btn:disabled { opacity: .45; cursor: default; }
.tab:focus-visible, .btn:focus-visible, .node:focus-visible { outline: 2px solid var(--mta); outline-offset: 2px; }

.caption { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; min-height: 44px; }
.caption .num {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font: 600 13px var(--font-body); background: var(--mail); color: #fff; font-variant-numeric: tabular-nums;
}
.caption .lbl { font-weight: 600; font-size: 15px; }
.caption .txt { color: var(--muted); font-size: 14px; }
@media (max-width: 700px) { .btns { margin-left: 0; width: 100%; } .btn { flex: 1; } }

/* Map */
.stage {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px;
  display: grid;
  place-items: center;
  overflow-x: auto;
}
.stage svg { display: block; width: 100%; height: auto; max-height: 68vh; min-width: 720px; font-family: var(--font-body); }

svg text { fill: var(--fg); font-size: 15px; }
svg .t-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
svg .t-sub { fill: var(--muted); font-size: 12.5px; }
svg .t-frame { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }

.frame rect { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; rx: 14; }
.frame.f-panel rect { stroke: var(--panel); }
.frame.f-mta rect { stroke: var(--mta); }
.frame.f-ext rect { stroke: var(--ext); stroke-dasharray: 5 4; }
.frame.f-ci rect { stroke: var(--ci); stroke-dasharray: 5 4; }
.t-frame.c-panel { fill: var(--panel); }
.t-frame.c-mta { fill: var(--mta); }
.t-frame.c-ext { fill: var(--ext); }
.t-frame.c-ci { fill: var(--ci); }

.node { cursor: pointer; }
.node > rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; rx: 9; transition: stroke .25s, stroke-width .25s; }
.node:hover > rect { stroke: var(--fg); }
.node.focus > rect { stroke: var(--mail); stroke-width: 3; }
.node.selected > rect { stroke: var(--fg); stroke-width: 2.4; }
.node .stripe { rx: 0; }
.node.k-panel .stripe { fill: var(--panel); }
.node.k-mta .stripe { fill: var(--mta); }
.node.k-ext .stripe { fill: var(--ext); }
.node.k-ci .stripe { fill: var(--ci); }
.node.k-store .stripe { fill: var(--disk); }

.edge { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); transition: stroke .25s, stroke-width .25s; }
.edge.active { stroke: var(--fg); stroke-width: 2.6; marker-end: url(#arrow-strong); }
#arrow path { fill: var(--line); }
#arrow-strong path { fill: var(--fg); }

.packet { pointer-events: none; opacity: 0; }
.packet.show { opacity: 1; }
.packet .dot { stroke: var(--surface); stroke-width: 2.5; }
.packet.k-mail .dot { fill: var(--mail); }
.packet.k-api .dot { fill: var(--api); }
.packet.k-disk .dot { fill: var(--disk); }
.packet.k-pkg .dot { fill: var(--pkg); }
.packet text { font-size: 12px; font-weight: 700; fill: #fff; text-anchor: middle; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend .l-mail::before { background: var(--mail); }
.legend .l-api::before { background: var(--api); }
.legend .l-disk::before { background: var(--disk); }
.legend .l-pkg::before { background: var(--pkg); }

/* Reference cards */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .reader { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 10px; font-weight: 700; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; align-items: center; }
.steps li:hover { background: var(--surface-2); }
.steps li.current { background: var(--surface-2); font-weight: 600; }
.steps .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.steps li.current .num { background: var(--mail); color: #fff; border-color: var(--mail); }
.steps li.done .num { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.detail dl { margin: 0; display: grid; gap: 8px; }
.detail dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.detail dd { margin: 1px 0 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .node > rect, .edge { transition: none; } }
</style>

  var DETAILS = {

    'n-recipients': { title: 'Получатели', rows: [['Как находим', 'По MX-записи домена получателя в DNS.'], ['Что они проверяют', 'SPF: IP нашего MTA разрешён для домена. DKIM: подпись сходится с ключом в DNS. Репутацию IP.']] },

    'n-actions': { title: 'Сборка в GitHub', rows: [['Что делает', 'Тесты, сборка sendry и sendry-web, deb и rpm пакеты, Docker-образ.'], ['Результат', 'Один deb-пакет, внутри и панель, и MTA. На каждом сервере включается только нужный сервис.']] },
    'n-release': { title: 'Релиз', rows: [['Что это', 'Страница релиза в GitHub с пакетами плюс APT-репозиторий.'], ['Сейчас', 'Серверы обновляются вручную: mx1 на 0.4.15, панель на 0.4.19, последний релиз 0.4.20.'], ['План', 'После релиза GitHub по SSH обновляет сначала MTA по одному, потом панель, с проверкой и бэкапом.']] }
  };

  var svg = document.getElementById('map');
  var packet = document.getElementById('packet');
  var packetLabel = document.getElementById('packet-label');
  var tabs = document.getElementById('tabs');
  var stepsEl = document.getElementById('steps');
  var titleEl = document.getElementById('scenario-title');
  var introEl = document.getElementById('scenario-intro');
  var capNum = document.getElementById('cap-num');
  var capLbl = document.getElementById('cap-lbl');
  var capTxt = document.getElementById('cap-txt');
  var btnPlay = document.getElementById('btn-play');
  var btnNext = document.getElementById('btn-next');
  var btnPrev = document.getElementById('btn-prev');
  var btnReset = document.getElementById('btn-reset');
  var detailTitle = document.getElementById('detail-title');
  var detailBody = document.getElementById('detail-body');

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var current = 'api';
  var stepIndex = -1;
  var playing = false;
  var animFrame = null;
  var timer = null;
  var ICONS = { mail: '✉', api: '→', disk: '▮', pkg: '↓' };

  function clearFocus() {
    Array.prototype.forEach.call(svg.querySelectorAll('.node.focus'), function (n) { n.classList.remove('focus'); });
    Array.prototype.forEach.call(svg.querySelectorAll('.edge.active'), function (e) { e.classList.remove('active'); });
  }

  function renderTabs() {
    tabs.innerHTML = '';
    Object.keys(SCENARIOS).forEach(function (key) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', key === current ? 'true' : 'false');
      b.textContent = SCENARIOS[key].title;
      b.addEventListener('click', function () { selectScenario(key); });
      tabs.appendChild(b);
    });
  }

  function renderSteps() {
    var sc = SCENARIOS[current];
    titleEl.textContent = sc.title;
    introEl.textContent = sc.intro;
    stepsEl.innerHTML = '';
    sc.steps.forEach(function (s, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="num">' + (i + 1) + '</span><span>' + s.label + '</span>';
      li.addEventListener('click', function () { stopPlaying(); goTo(i); });
      stepsEl.appendChild(li);
    });
    updateSteps();
  }

  function updateSteps() {
    var sc = SCENARIOS[current];
    Array.prototype.forEach.call(stepsEl.children, function (li, i) {
      li.classList.toggle('current', i === stepIndex);
      li.classList.toggle('done', i < stepIndex);
    });
    btnNext.disabled = stepIndex >= sc.steps.length - 1;
    btnPrev.disabled = stepIndex <= 0;
    if (stepIndex < 0) {
      capNum.textContent = '1';
      capLbl.textContent = sc.intro;
      capTxt.textContent = 'Нажми «Запустить» или «Шаг».';
    } else {
      var s = sc.steps[stepIndex];
      capNum.textContent = String(stepIndex + 1);
      capLbl.textContent = s.label;
      capTxt.textContent = s.text;
    }
  }

  function selectScenario(key) {
    stopPlaying();
    current = key;
    stepIndex = -1;
    clearFocus();
    packet.classList.remove('show');
    renderTabs();
    renderSteps();
  }

  function goTo(i, done) {
    var sc = SCENARIOS[current];
    if (i < 0 || i >= sc.steps.length) return;
    stepIndex = i;
    updateSteps();
    clearFocus();
    var step = sc.steps[i];
    var path = document.getElementById(step.path);
    if (path) path.classList.add('active');
    (step.focus || []).forEach(function (id) {
      var n = document.getElementById(id);
      if (n) n.classList.add('focus');
    });
    animatePacket(path, step.kind, !!step.reverse, done);
  }

  function animatePacket(path, kind, reverse, done) {
    if (animFrame) cancelAnimationFrame(animFrame);
    packet.setAttribute('class', 'packet show k-' + kind);
    packetLabel.textContent = ICONS[kind] || '•';
    if (!path) { if (done) done(); return; }
    var len = path.getTotalLength();
    var dur = reduced ? 0 : Math.max(900, Math.min(1800, len * 5));
    var start = null;
    function place(t) {
      var p = path.getPointAtLength(reverse ? len * (1 - t) : len * t);
      packet.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')');
    }
    if (dur === 0) { place(1); if (done) done(); return; }
    function frame(ts) {
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / dur);
      var e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      place(e);
      if (t < 1) { animFrame = requestAnimationFrame(frame); }
      else { animFrame = null; if (done) done(); }
    }
    animFrame = requestAnimationFrame(frame);
  }

  function playNext() {
    if (!playing) return;
    if (stepIndex >= SCENARIOS[current].steps.length - 1) { stopPlaying(); return; }
    goTo(stepIndex + 1, function () { timer = setTimeout(playNext, 1600); });
  }
  function startPlaying() {
    if (stepIndex >= SCENARIOS[current].steps.length - 1) stepIndex = -1;
    playing = true;
    btnPlay.textContent = '❚❚ Пауза';
    playNext();
  }
  function stopPlaying() {
    playing = false;
    if (timer) { clearTimeout(timer); timer = null; }
    btnPlay.textContent = '▶ Запустить';
  }

  btnPlay.addEventListener('click', function () { if (playing) stopPlaying(); else startPlaying(); });
  btnNext.addEventListener('click', function () { stopPlaying(); goTo(stepIndex + 1); });
  btnPrev.addEventListener('click', function () { stopPlaying(); goTo(stepIndex - 1); });
  btnReset.addEventListener('click', function () { stopPlaying(); stepIndex = -1; clearFocus(); packet.classList.remove('show'); updateSteps(); });

  function showDetail(id) {
    var d = DETAILS[id];
    if (!d) return;
    Array.prototype.forEach.call(svg.querySelectorAll('.node.selected'), function (n) { n.classList.remove('selected'); });
    var node = document.getElementById(id);
    if (node) node.classList.add('selected');
    detailTitle.textContent = d.title;
    var html = '<dl>';
    d.rows.forEach(function (r) { html += '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>'; });
    detailBody.innerHTML = html + '</dl>';
  }
  Array.prototype.forEach.call(svg.querySelectorAll('.node'), function (n) {
    n.addEventListener('click', function () { showDetail(n.id); });
    n.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showDetail(n.id); } });
  });

  renderTabs();
  renderSteps();
})();
</script>

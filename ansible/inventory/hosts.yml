all:
  children:
    # Parent group for playbook
    sendry_servers:
      children:
        sendry_mta_cluster:
        sendry_panel:



    # MTA servers
    sendry_mta_cluster:
      hosts:
        mx1.semena.run:
          sendry_hostname: mx1.semena.run
        mx2.semena.run:
          sendry_hostname: mx2.semena.run

      vars:
        sendry_mta_enabled: true
        sendry_web_enabled: false
        sendry_install_method: repository

        sendry_api_key: "ibeeSeig9zo8ooghaer3noyeahoo"
        sendry_smtp_auth_users:
          admin: "quubaoGeg8neiDee3ekahVee5Zie"

        # Domains managed via web panel
        sendry_domains: {}

    # Web panel
    sendry_panel:
      hosts:
        sendry.soroka.app:

      vars:
        sendry_mta_enabled: false
        sendry_web_enabled: true

        sendry_web_session_secret: "eegh3houXa1bae1oozauxi6lootaelei"

        # Connect to MTA servers
        sendry_web_servers:
          - name: "mx1"
            base_url: "http://mx1.semena.run:8080"
            api_key: "ibeeSeig9zo8ooghaer3noyeahoo"
            env: "prod"
          - name: "mx2"
            base_url: "http://mx2.semena.run:8080"
            api_key: "ibeeSeig9zo8ooghaer3noyeahoo"
            env: "prod"

        # Load balancing
        sendry_web_multi_send_strategy: round_robin
        sendry_web_multi_send_failover_enabled: true
        sendry_web_multi_send_failover_max_retries: 2

        # Caddy for HTTPS
        sendry_caddy_enabled: true
        sendry_caddy_domain: sendry.soroka.app
        sendry_caddy_email: "admin@soroka.app"

        # Serve /uploads/* on the panel domain too
        sendry_caddy_uploads_enabled: true

        # CDN host for uploads (fronted by external nginx on standard ports)
        sendry_caddy_uploads_hosts:
          - address: "http://client25.cdn-storage.site:8025"

        # Rewrite /uploads/... in outgoing email HTML to the CDN URL
        sendry_web_public_upload_url: "https://client25.cdn-storage.site"

  vars:
    ansible_user: root

# Deployment:
#   1. Deploy MTA servers:
#      ansible-playbook -i inventory/hosts.yml playbooks/sendry.yml -l sendry_mta_cluster
#
#   2. Deploy web panel:
#      ansible-playbook -i inventory/hosts.yml playbooks/sendry.yml -l sendry_panel
#
#   3. Add domains via panel: https://sendry.soroka.app/domains

{{define "content"}}
<div class="page-header">
    <h1><span data-i18n="cmp.cf_send_title">Sending:</span> <span id="cf-page-title">{{.Campaign.Name}}</span></h1>
    <a href="/campaigns/{{.Campaign.ID}}" class="btn btn-secondary" data-i18n="cmp.back_to_campaign">Back to campaign</a>
</div>

{{if .Error}}
<div class="alert alert-error">{{.Error}}</div>
{{else if .NoPublicURL}}
{{template "no_public_url" .}}
{{end}}

<div class="cf" id="cf" data-mode="send" data-campaign-id="{{.Campaign.ID}}">
    {{template "cf_letter" .}}
    <form method="post" action="/campaigns/{{.Campaign.ID}}/send" id="cf-form" novalidate>
        {{template "cf_send" .}}
    </form>
</div>

<script>
window.CF_CONFIG = {
    mode: "send",
    campaignId: {{toJSON .Campaign.ID}},
    noPublicURL: {{if .NoPublicURL}}true{{else}}false{{end}},
    isAdmin: {{if .User.IsAdmin}}true{{else}}false{{end}},
    userEmail: {{toJSON .UserEmail}},
    senderDomains: {{toJSON .SenderDomains}}
};
</script>
<script src="/static/js/campaign-flow.js"></script>
{{end}}

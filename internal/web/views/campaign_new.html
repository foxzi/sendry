{{define "content"}}
<div class="page-header">
    <h1 id="cf-page-title" data-i18n="cmp.new_campaign_title">New Campaign</h1>
    <a href="/campaigns" class="btn btn-secondary" data-i18n="cancel">Cancel</a>
</div>

<div class="cf" id="cf" data-mode="create">
    <form method="post" action="/campaigns" id="cf-form" novalidate>
        <!-- the browser's time zone offset: the date in an automatic name is the user's -->
        <input type="hidden" id="tz_offset" name="tz_offset">
        {{template "cf_letter" .}}

        <div class="cf-final">
            <button type="submit" id="cf-save" name="action" value="save" class="btn" data-i18n="cmp.wz_save">Save</button>
            <button type="submit" id="cf-launch" name="action" value="launch" class="btn btn-primary" data-i18n="cmp.wz_save_launch">Save and send&hellip;</button>
            <p class="cf-final-help" id="cf-final-help"></p>
        </div>
    </form>
</div>

<script>
window.CF_CONFIG = {
    mode: "create",
    campaignId: "",
    noPublicURL: {{if .NoPublicURL}}true{{else}}false{{end}},
    isAdmin: {{if .User.IsAdmin}}true{{else}}false{{end}},
    userEmail: {{toJSON .UserEmail}},
    senderDomains: {{toJSON .SenderDomains}}
};
</script>
<script src="/static/js/campaign-flow.js"></script>
{{end}}

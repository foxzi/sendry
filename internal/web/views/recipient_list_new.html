{{define "content"}}
<div class="page-header">
    <h1 data-i18n="cmp.new_list_title">New Recipient List</h1>
</div>

<form method="post" action="/recipients" class="card">
    <div class="card-body">
        <div class="form-group">
            <label for="name" data-i18n="cmp.name_req">Name *</label>
            <input type="text" id="name" name="name" required class="input" placeholder="Newsletter Subscribers" data-i18n-placeholder="cmp.ph_list_name">
        </div>

        <div class="form-group">
            <label for="description" data-i18n="common.description">Description</label>
            <textarea id="description" name="description" class="input" rows="3" placeholder="Describe this recipient list..." data-i18n-placeholder="cmp.ph_list_desc"></textarea>
        </div>
    </div>

    <div class="card-footer">
        <a href="/recipients" class="btn btn-secondary" data-i18n="cancel">Cancel</a>
        <button type="submit" class="btn btn-primary" data-i18n="cmp.create_list">Create List</button>
    </div>
</form>

<div class="card" style="margin-top: 1.5rem">
    <div class="card-header">
        <h2 data-i18n="cmp.whats_next">What's next?</h2>
    </div>
    <div class="card-body">
        <p data-i18n="cmp.after_create">After creating the list, you can:</p>
        <ul>
            <li data-i18n="cmp.next_import">Import recipients from a CSV file</li>
            <li data-i18n="cmp.next_manual">Add recipients manually one by one</li>
            <li data-i18n="cmp.next_api">Use the API to add recipients programmatically</li>
        </ul>
    </div>
</div>
{{end}}
